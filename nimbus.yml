version: 1

runtime:
  node: "20.0"

install:
  # 1. Copy the generated .env into backend folder first
  - cp .env backend/.env
  # 2. Sync schema provider with DATABASE_URL
  - node backend/scripts/sync-provider.js
  # 3. Install backend dependencies
  - npm --prefix backend install
  # 4. Generate Prisma client with explicit schema path
  - npx --prefix backend prisma generate --schema=backend/prisma/schema.prisma
  # 5. Install frontend dependencies
  - npm --prefix frontend install

build:
  # 1. Push schema to MySQL database
  - npx --prefix backend prisma db push --schema=backend/prisma/schema.prisma
  # 2. Seed initial admin & roles
  - node backend/prisma/seed.js
  # 3. Compile frontend React app
  - npm --prefix frontend run build

supervisor:
  program: "maharaj_backend"
  config: |
    [program:maharaj_backend]
    command=node {domainPath}/backend/src/index.js
    directory={domainPath}/backend
    autostart=true
    autorestart=true
    user=www-data
    environment=NODE_ENV="production",PORT="5000"
    stdout_logfile={domainPath}/logs/backend.out.log
    stderr_logfile={domainPath}/logs/backend.err.log

env:
  PORT: "5000"
  NODE_ENV: "production"
  FRONTEND_URL: "https://maharaj.sudhirrajai.com"
